# `docker compose up` builds the sandbox image, then starts the API on 127.0.0.1:8000.
# Settings come from GLIMPSE_* variables in your shell or a `.env` file next to this
# file (Compose loads it for the ${VAR:-default} substitutions below).
services:
  sandbox:
    # Build-only service: produces the `glimpse-sandbox` image the API needs.
    build: ./sandbox
    image: glimpse-sandbox
    command: ["true"]
    network_mode: none

  api:
    build: .
    image: glimpse-api
    ports:
      # Loopback by default; set GLIMPSE_BIND=0.0.0.0 to expose it directly (or put
      # deploy/docker-compose.prod.yml's Caddy in front).
      - "${GLIMPSE_BIND:-127.0.0.1}:${GLIMPSE_PORT:-8000}:8000"
    environment:
      GLIMPSE_RUNNER: docker
      GLIMPSE_HOST: 0.0.0.0
      GLIMPSE_SANDBOX_IMAGE: glimpse-sandbox
      GLIMPSE_LOG_LEVEL: ${GLIMPSE_LOG_LEVEL:-info}
      GLIMPSE_API_KEYS: ${GLIMPSE_API_KEYS:-}
      GLIMPSE_RATE_LIMIT: ${GLIMPSE_RATE_LIMIT:-30/minute}
      GLIMPSE_GLOBAL_RATE_LIMIT: ${GLIMPSE_GLOBAL_RATE_LIMIT:-}
      GLIMPSE_CORS_ORIGINS: ${GLIMPSE_CORS_ORIGINS:-*}
      GLIMPSE_TRUST_PROXY: ${GLIMPSE_TRUST_PROXY:-false}
      GLIMPSE_CLIENT_IP_HEADER: ${GLIMPSE_CLIENT_IP_HEADER:-}
      GLIMPSE_DEFAULT_TIMEOUT_S: ${GLIMPSE_DEFAULT_TIMEOUT_S:-10}
      GLIMPSE_MAX_TIMEOUT_S: ${GLIMPSE_MAX_TIMEOUT_S:-30}
      GLIMPSE_SANDBOX_POOL_SIZE: ${GLIMPSE_SANDBOX_POOL_SIZE:-4}
      GLIMPSE_SANDBOX_REFILL_CONCURRENCY: ${GLIMPSE_SANDBOX_REFILL_CONCURRENCY:-2}
      GLIMPSE_SANDBOX_MAX_CONCURRENCY: ${GLIMPSE_SANDBOX_MAX_CONCURRENCY:-4}
      GLIMPSE_SANDBOX_QUEUE_TIMEOUT_S: ${GLIMPSE_SANDBOX_QUEUE_TIMEOUT_S:-2}
      GLIMPSE_SANDBOX_QUEUE_SIZE: ${GLIMPSE_SANDBOX_QUEUE_SIZE:-16}
      GLIMPSE_SANDBOX_MEMORY_MB: ${GLIMPSE_SANDBOX_MEMORY_MB:-512}
      GLIMPSE_SANDBOX_CPUS: ${GLIMPSE_SANDBOX_CPUS:-1.0}
      GLIMPSE_SANDBOX_PIDS_LIMIT: ${GLIMPSE_SANDBOX_PIDS_LIMIT:-128}
      GLIMPSE_SANDBOX_TMPFS_MB: ${GLIMPSE_SANDBOX_TMPFS_MB:-64}
    volumes:
      # The API talks to the host daemon to create sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox:
        condition: service_completed_successfully
    restart: unless-stopped
