[project]
name = "glimpse"
version = "1.0.0"
description = "Run untrusted code snippets in isolated sandboxes over a small HTTP API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Davis Keene" }]
keywords = ["sandbox", "code-execution", "docker", "lambda", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Interpreters",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "docker>=7.1",
  "boto3>=1.34",
]

[project.scripts]
glimpse = "glimpse.cli:main"

[project.urls]
Homepage = "https://github.com/daviskeene/glimpse"
Demo = "https://glimpse.daviskeene.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glimpse"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-docker",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",  # assert (tests)
  "S603",  # subprocess without shell — we build argv ourselves, on purpose
  "S607",  # partial executable path — PATH lookup is intended for toolchains
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["glimpse", "lambda_handler.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker: integration tests that need a Docker daemon and the glimpse-sandbox image",
]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
